name: Build and Publish Latest

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            curl \
            git \
            libtool \
            mingw-w64 \
            nasm \
            pkg-config \
            yasm \
            xz-utils

      - name: Test and lint
        run: |
          cargo fmt --all --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace --target x86_64-pc-windows-gnu --features stt-gui/native-gui

      - name: Check third-party notices
        run: |
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES.txt
          grep -qi 'FFmpeg' THIRD_PARTY_NOTICES.txt
          grep -qi 'PortAudio' THIRD_PARTY_NOTICES.txt
          test -s THIRD_PARTY_LICENSES/FFmpeg-GPL-3.0-or-later.txt
          test -s THIRD_PARTY_LICENSES/PortAudio-MIT.txt
          test -s THIRD_PARTY_LICENSES/LAME-LGPL-2.0-only.txt
          test -s THIRD_PARTY_LICENSES/Opus-BSD-3-Clause.txt

      - name: Check FFmpeg nonfree is disabled
        run: |
          if grep -n -- '--enable-nonfree' scripts/build-ffmpeg-windows-amd64.sh; then
            echo "FFmpeg nonfree components must not be enabled." >&2
            exit 1
          fi

      - name: Build PortAudio for MinGW
        run: scripts/build-portaudio-windows-amd64.sh

      - name: Verify PortAudio backend contract
        run: |
          portaudio_libs="$(pkg-config --static --libs build/portaudio-win/lib/pkgconfig/portaudio-2.0.pc)"
          echo "$portaudio_libs"
          echo "$portaudio_libs" | grep -i 'winmm'
          if echo "$portaudio_libs" | grep -i 'wasapi'; then
            echo "PortAudio must use WMME without WASAPI." >&2
            exit 1
          fi

      - name: Build static FFmpeg/libav for MinGW
        run: scripts/build-ffmpeg-windows-amd64.sh

      - name: Build Rust CLI and native GUI
        run: scripts/build-rust-windows-amd64.sh

      - name: Verify binary contracts
        run: |
          if grep -R -n -E 'SendInput|\bbeeep\b|Toast' crates native; then
            echo "A forbidden input or notification implementation is present." >&2
            exit 1
          fi
          if grep -R -n -E 'rename[[:space:]]*=[[:space:]]*"NOTIFICATION"' crates; then
            echo "The removed NOTIFICATION field is serialized." >&2
            exit 1
          fi
          x86_64-w64-mingw32-objdump -x dist/gui/STT.exe | grep 'keybd_event'
          if x86_64-w64-mingw32-objdump -x dist/gui/STT.exe | grep 'SendInput'; then
            echo "GUI imports SendInput." >&2
            exit 1
          fi
          if strings dist/gui/STT.exe | grep '\[ffmpeg\] executing: ffmpeg'; then
            echo "GUI contains the external FFmpeg backend." >&2
            exit 1
          fi
          strings dist/gui/STT.exe | grep '\[ffmpeg\] libav convert'
          strings dist/cli/stt.exe | grep '\[ffmpeg\] executing: ffmpeg'
          imports="$(x86_64-w64-mingw32-objdump -p dist/gui/STT.exe | grep 'DLL Name')"
          echo "$imports"
          if echo "$imports" | grep -E -i 'avcodec|avformat|avutil|swresample|portaudio'; then
            echo "GUI has a dynamic PortAudio or libav dependency." >&2
            exit 1
          fi

      - name: Package releases
        run: scripts/package-windows-release.sh

      - name: Move Latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Latest "$GITHUB_SHA"
          git push origin refs/tags/Latest --force

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated Rust build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
          if gh release view Latest; then
            gh release edit Latest --title "Latest" --notes "$notes"
          else
            gh release create Latest --title "Latest" --notes "$notes"
          fi
          gh release upload Latest \
            dist/stt-cli-windows-amd64.zip \
            dist/stt-cli-windows-amd64.zip.sha256 \
            dist/stt-gui-windows-amd64.zip \
            dist/stt-gui-windows-amd64.zip.sha256 \
            --clobber
